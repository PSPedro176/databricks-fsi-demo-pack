# =============================================================================
# BI bundle - Credit Decisioning: dashboard + Genie space
# =============================================================================
# Deployed by the BI bundle AFTER the core bundle's credit_job has created the
# tables (catalog.fsi_credit.*). Kept separate from the compute/data bundle so
# these BI assets deploy against tables that already exist.
# =============================================================================

resources:
  dashboards:
    credit_decisioning_dashboard:
      display_name: "[FSI Demo Pack] - Credit Decisioning"
      warehouse_id: ${var.warehouse_id}
      file_path: ../../lakehouse-fsi-credit/_dashboards/credit_decisioning.lvdash.json
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.credit_schema}
      permissions:
        - level: CAN_READ
          group_name: users

  genie_spaces:
    credit_decisioning_genie:
      title: "[FSI Demo Pack] - Credit Decisioning"
      description: "Analyze credit decisioning data with the GenAI Assistant: customer profiles, credit bureau data, model explanations and features."
      warehouse_id: ${var.warehouse_id}
      serialized_space: |-
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "83f88c651d904bc3b39fa0c1511fbf11",
                "question": [
                  "Which customers have the highest credit risk based on their prediction scores?"
                ]
              },
              {
                "id": "ae88547320504342a1ec21755334c8ac",
                "question": [
                  "Show me the total credit overdue amounts by customer"
                ]
              },
              {
                "id": "8dd2dec379264f06a788974f686c81d1",
                "question": [
                  "What are the average tenure and revenue for customers grouped by education level?"
                ]
              },
              {
                "id": "469607a455d042128406ea1fb28bc576",
                "question": [
                  "Which customers have the highest transaction volume in the last 12 months?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.catalog}.fsi_credit.credit_bureau_gold",
                "column_configs": [
                  {
                    "column_name": "AMT_CREDIT_MAX_OVERDUE"
                  },
                  {
                    "column_name": "AMT_CREDIT_SUM"
                  },
                  {
                    "column_name": "AMT_CREDIT_SUM_DEBT"
                  },
                  {
                    "column_name": "AMT_CREDIT_SUM_OVERDUE"
                  },
                  {
                    "column_name": "CNT_CREDIT_PROLONG"
                  },
                  {
                    "column_name": "CREDIT_ACTIVE"
                  },
                  {
                    "column_name": "CREDIT_DAY_OVERDUE"
                  },
                  {
                    "column_name": "CUST_ID"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.credit_decisioning_features",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "education"
                  },
                  {
                    "column_name": "marital_status"
                  },
                  {
                    "column_name": "months_employment"
                  },
                  {
                    "column_name": "product_cnt"
                  },
                  {
                    "column_name": "revenue_tot"
                  },
                  {
                    "column_name": "tenure_months"
                  },
                  {
                    "column_name": "tot_rel_bal"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.customer_gold",
                "column_configs": [
                  {
                    "column_name": "city"
                  },
                  {
                    "column_name": "email"
                  },
                  {
                    "column_name": "first_name"
                  },
                  {
                    "column_name": "gender"
                  },
                  {
                    "column_name": "id"
                  },
                  {
                    "column_name": "last_name"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.fund_trans_gold",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "dist_payee_cnt_12m"
                  },
                  {
                    "column_name": "dist_payer_cnt_12m"
                  },
                  {
                    "column_name": "rcvd_txn_amt_12m"
                  },
                  {
                    "column_name": "rcvd_txn_cnt_12m"
                  },
                  {
                    "column_name": "sent_txn_amt_12m"
                  },
                  {
                    "column_name": "sent_txn_cnt_12m"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.telco_gold",
                "column_configs": [
                  {
                    "column_name": "avg_phone_bill_amt_lst12mo"
                  },
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "is_pre_paid"
                  },
                  {
                    "column_name": "number_payment_delays_last12mo"
                  },
                  {
                    "column_name": "phone_bill_amt"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.underbanked_prediction",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "education"
                  },
                  {
                    "column_name": "prediction"
                  },
                  {
                    "column_name": "revenue_tot"
                  },
                  {
                    "column_name": "tenure_months"
                  },
                  {
                    "column_name": "tot_rel_bal"
                  }
                ]
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "4b19f4a74c0549e48ba3ad0ce1915d69",
                "content": [
                  "This Genie space helps analysts explore credit decisioning data. It covers customer profiles, credit bureau history, fund transactions, telco data, engineered features, and model predictions for underbanked customer identification.",
                  "Join tables on customer ID: customer_gold.id = credit_bureau_gold.CUST_ID = fund_trans_gold.cust_id = telco_gold.cust_id = credit_decisioning_features.cust_id = underbanked_prediction.cust_id",
                  "The underbanked_prediction table contains the model output. The 'prediction' column indicates whether the customer is predicted to be underbanked (1) or not (0). Use credit_decisioning_features for the input features used by the model."
                ]
              }
            ]
          }
        }
      permissions:
        - level: CAN_RUN
          group_name: users

bundle:
  name: fsi_demo_pack

variables:
  catalog:
    description: "Unity Catalog catalog for all demos (required; pass --var catalog=<your_catalog>)"
  credit_schema:
    description: "Schema for the Credit Decisioning demo"
    default: fsi_credit
  smart_claims_schema:
    description: "Schema for the Smart Claims demo"
    default: fsi_smart_claims
  credit_volume:
    description: "Volume name for credit raw data"
    default: credit_raw_data
  claims_volume:
    description: "Volume name for claims data"
    default: volume_claims
  ml_cluster_id:
    description: "Cluster ID for ML tasks (managed by the bundle)"
    default: ""
  warehouse_id:
    description: "SQL Warehouse ID for dashboards and Genie spaces"
    default: ""
  node_type_id:
    description: "ML cluster node type (cloud-specific). AWS default; override for GCP/Azure, e.g. --var node_type_id=n2-highmem-4 (GCP) or Standard_DS4_v2 (Azure)"
    default: r6id.xlarge
  aws_attributes:
    description: "AWS-only cluster attributes. Default forces ON_DEMAND (the workspace default is SPOT). On GCP/Azure deploy with --var 'aws_attributes={}'"
    type: complex
    default:
      availability: ON_DEMAND

workspace:
  root_path: /Users/${workspace.current_user.userName}/fsi_demo_pack

include:
  - resources/*.yml

resources:
  clusters:
    ml_cluster:
      cluster_name: "[FSI Demo Pack] ML Cluster"
      spark_version: "15.4.x-cpu-ml-scala2.12"
      node_type_id: ${var.node_type_id}
      driver_node_type_id: ${var.node_type_id}
      autoscale:
        min_workers: 2
        max_workers: 8
      aws_attributes: ${var.aws_attributes}
      autotermination_minutes: 120
      data_security_mode: SINGLE_USER
      single_user_name: ${workspace.current_user.userName}

targets:
  dev:
    mode: development
    default: true
    variables:
      ml_cluster_id: ${resources.clusters.ml_cluster.id}

  staging:
    variables:
      ml_cluster_id: ${resources.clusters.ml_cluster.id}

  prod:
    mode: production
    variables:
      ml_cluster_id: ${resources.clusters.ml_cluster.id}

# =============================================================================
# AI/BI Portfolio Assistant
# =============================================================================
# Init-data job. The dashboard + Genie space live in resources/dashboards.yml
# and resources/genies.yml (inline serialized_* so ${var.catalog} is substituted
# at deploy). Tables (schema: fsi_portfolio_assistant):
#   portfolio, fundamentals, prices, news, news_ticker
# =============================================================================

resources:
  jobs:
    portfolio_assistant_init:
      name: "[FSI Demo Pack] Portfolio Assistant - Init Data"
      tasks:
        - task_key: init_data
          notebook_task:
            notebook_path: ../aibi-portfolio-assistant/_resources/00-setup.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: fsi_portfolio_assistant
              volume_name: portfolio_raw_data
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users

  dashboards:
    portfolio_assistant_dashboard:
      display_name: "[FSI Demo Pack] - Portfolio Assistant"
      warehouse_id: ${var.warehouse_id}
      file_path: ../aibi-portfolio-assistant/_dashboards/portfolio_assistant.lvdash.json
      dataset_catalog: ${var.catalog}
      dataset_schema: fsi_portfolio_assistant
      permissions:
        - level: CAN_READ
          group_name: users

  genie_spaces:
    portfolio_assistant_genie:
      title: "[FSI Demo Pack] - Portfolio Assistant"
      description: "Easily analyze your portfolio performance and market trends using the GenAI Assistant."
      warehouse_id: ${var.warehouse_id}
      serialized_space: |-
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "q1_portfolio_top",
                "question": [
                  "What are the top 5 companies in my portfolio by market capitalization?"
                ]
              },
              {
                "id": "q2_volatility",
                "question": [
                  "Show me market volatility during the 2008 financial crisis"
                ]
              },
              {
                "id": "q3_sentiment",
                "question": [
                  "What is the sentiment distribution for technology stocks?"
                ]
              },
              {
                "id": "q4_negative_news",
                "question": [
                  "What are the latest negative news events impacting my portfolio?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.portfolio",
                "column_configs": [
                  {
                    "column_name": "ticker"
                  },
                  {
                    "column_name": "company_name"
                  },
                  {
                    "column_name": "industry"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.fundamentals",
                "column_configs": [
                  {
                    "column_name": "ticker"
                  },
                  {
                    "column_name": "market_capitalization"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.prices",
                "column_configs": [
                  {
                    "column_name": "ticker"
                  },
                  {
                    "column_name": "date"
                  },
                  {
                    "column_name": "close"
                  },
                  {
                    "column_name": "return"
                  },
                  {
                    "column_name": "split_factor"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.news",
                "column_configs": [
                  {
                    "column_name": "article_id"
                  },
                  {
                    "column_name": "title"
                  },
                  {
                    "column_name": "published_time"
                  },
                  {
                    "column_name": "sentiment"
                  },
                  {
                    "column_name": "market_sentiment"
                  },
                  {
                    "column_name": "source"
                  },
                  {
                    "column_name": "source_url"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.news_ticker",
                "column_configs": [
                  {
                    "column_name": "article_id"
                  },
                  {
                    "column_name": "ticker"
                  }
                ]
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "instr_context",
                "content": [
                  "This Genie space helps portfolio managers analyze their investment portfolio performance and market trends. The data covers stock prices, company fundamentals, and financial news with sentiment analysis."
                ]
              },
              {
                "id": "instr_joins",
                "content": [
                  "Join portfolio to prices on ticker. Join portfolio to fundamentals on ticker. Join news to news_ticker on article_id. Join news_ticker to portfolio on ticker."
                ]
              }
            ]
          }
        }
      permissions:
        - level: CAN_RUN
          group_name: users

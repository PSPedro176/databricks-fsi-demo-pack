# =============================================================================
# AI/BI Portfolio Assistant
# =============================================================================
# Init-data job only. The dashboard + Genie space live in the separate "bi"
# bundle (resources-aibi/resources/portfolio_bi.yml) and deploy after this job creates the
# tables (schema: fsi_portfolio_assistant). See README.
# =============================================================================

resources:
  jobs:
    portfolio_assistant_init:
      name: "[FSI Demo Pack] Portfolio Assistant - Init Data"
      tasks:
        - task_key: init_data
          notebook_task:
            notebook_path: ../aibi-portfolio-assistant/_resources/00-setup.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: fsi_portfolio_assistant
              volume_name: portfolio_raw_data
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users


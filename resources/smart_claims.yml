# =============================================================================
# Lakehouse FSI - Smart Claims
# =============================================================================
# Pipeline SDP (serverless, photon, advanced) + Job with 6 tasks
# Tables: catalog.fsi_smart_claims.*
# =============================================================================

resources:
  pipelines:
    smart_claims_pipeline:
      name: "[FSI Demo Pack] SDP - Smart Claims"
      development: true
      photon: true
      serverless: true
      edition: ADVANCED
      channel: CURRENT
      catalog: ${var.catalog}
      schema: ${var.smart_claims_schema}
      configuration:
        bundle.catalog: ${var.catalog}
        bundle.schema: ${var.smart_claims_schema}
      libraries:
        - notebook:
            path: ../lakehouse-fsi-smart-claims/01-Data-Ingestion/transformations

  jobs:
    smart_claims_job:
      name: "[FSI Demo Pack] Smart Claims - Full Pipeline"
      max_concurrent_runs: 1
      tasks:
        - task_key: init_data
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-smart-claims/_resources/00-setup
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.smart_claims_schema}
              volume_name: ${var.claims_volume}

        - task_key: claim_policy_sdp_pipeline
          depends_on:
            - task_key: init_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.smart_claims_pipeline.id}
            full_refresh: true

        - task_key: train_model
          depends_on:
            - task_key: init_data
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-smart-claims/02-Data-Science-ML/02.1-Model-Training
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.smart_claims_schema}
              volume_name: ${var.claims_volume}

        - task_key: predict_accident_severity
          depends_on:
            - task_key: claim_policy_sdp_pipeline
            - task_key: train_model
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-smart-claims/02-Data-Science-ML/02.2-Batch-Scoring
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.smart_claims_schema}
              volume_name: ${var.claims_volume}

        - task_key: rule_engine
          depends_on:
            - task_key: predict_accident_severity
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-smart-claims/02-Data-Science-ML/02.3-Dynamic-Rule-Engine
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.smart_claims_schema}
              volume_name: ${var.claims_volume}

        - task_key: create_ai_functions
          depends_on:
            - task_key: rule_engine
          notebook_task:
            notebook_path: ../lakehouse-fsi-smart-claims/04-Generative-AI/04.1-AI-Functions-Creation
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.smart_claims_schema}
              volume_name: ${var.claims_volume}
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users

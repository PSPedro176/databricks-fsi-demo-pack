# =============================================================================
# Orchestrator - populate all demo data with one command
# =============================================================================
# Runs the three data jobs in parallel via run_job_task. Each job creates its
# own catalog/schema/volume and tables. Run this after `bundle deploy` (core) and
# before deploying the BI bundle (dashboards + Genie spaces):
#   databricks bundle run populate_all_data -t dev -p my-ws
# =============================================================================

resources:
  jobs:
    populate_all_data:
      name: "[FSI Demo Pack] Populate All Data"
      max_concurrent_runs: 1
      tasks:
        - task_key: credit
          run_job_task:
            job_id: ${resources.jobs.credit_job.id}
        - task_key: smart_claims
          run_job_task:
            job_id: ${resources.jobs.smart_claims_job.id}
        - task_key: portfolio
          run_job_task:
            job_id: ${resources.jobs.portfolio_assistant_init.id}
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users

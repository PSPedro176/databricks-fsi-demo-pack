# =============================================================================
# Lakehouse FSI - Credit Decisioning
# =============================================================================
# Pipeline SDP (serverless, photon, advanced) + 2 Jobs
# Tables: catalog.fsi_credit.*
# =============================================================================

resources:
  pipelines:
    credit_pipeline:
      name: "[FSI Demo Pack] SDP - Credit Decisioning"
      development: true
      photon: true
      serverless: true
      edition: ADVANCED
      channel: CURRENT
      catalog: ${var.catalog}
      schema: ${var.credit_schema}
      configuration:
        bundle.catalog: ${var.catalog}
        bundle.schema: ${var.credit_schema}
        bundle.volume: ${var.credit_volume}
      libraries:
        - glob:
            include: ../lakehouse-fsi-credit/01-Data-Ingestion/01.1-sdp-sql/transformations/**

  jobs:
    # -------------------------------------------------------------------------
    # Main job: uses ML cluster for most tasks, serverless for AutoML
    # -------------------------------------------------------------------------
    credit_job:
      name: "[FSI Demo Pack] Credit Decisioning - Full Pipeline"
      max_concurrent_runs: 1
      tasks:
        - task_key: init_data
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/_resources/01-load-data.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}

        - task_key: start_sdp_pipeline
          depends_on:
            - task_key: init_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.credit_pipeline.id}
            full_refresh: false

        - task_key: feature_engineering
          depends_on:
            - task_key: start_sdp_pipeline
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/03-Data-Science-ML/03.1-Feature-Engineering-credit-decisioning.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}

        - task_key: automl_model
          depends_on:
            - task_key: feature_engineering
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/03-Data-Science-ML/03.2-AutoML-credit-decisioning.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}

        - task_key: batch_scoring
          depends_on:
            - task_key: automl_model
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/03-Data-Science-ML/03.3-Batch-Scoring-credit-decisioning.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}

        - task_key: explainability_and_fairness
          depends_on:
            - task_key: batch_scoring
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/03-Data-Science-ML/03.5-Explainability-and-Fairness-credit-decisioning.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}

        - task_key: real_time_serving
          depends_on:
            - task_key: automl_model
          existing_cluster_id: ${var.ml_cluster_id}
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/03-Data-Science-ML/03.4-model-serving-BNPL-credit-decisioning.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}

        - task_key: create_ai_functions
          depends_on:
            - task_key: explainability_and_fairness
          notebook_task:
            notebook_path: ../lakehouse-fsi-credit/05-Generative-AI/05.1-AI-Functions-Creation.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.credit_schema}
              volume_name: ${var.credit_volume}
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

      permissions:
        - level: CAN_MANAGE_RUN
          group_name: users

  dashboards:
    credit_decisioning_dashboard:
      display_name: "[FSI Demo Pack] - Credit Decisioning"
      warehouse_id: ${var.warehouse_id}
      file_path: ../lakehouse-fsi-credit/_dashboards/credit_decisioning.lvdash.json
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.credit_schema}
      permissions:
        - level: CAN_READ
          group_name: users

  genie_spaces:
    credit_decisioning_genie:
      title: "[FSI Demo Pack] - Credit Decisioning"
      description: "Analyze credit decisioning data with the GenAI Assistant: customer profiles, credit bureau data, model explanations and features."
      warehouse_id: ${var.warehouse_id}
      serialized_space: |-
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "83f88c651d904bc3b39fa0c1511fbf11",
                "question": [
                  "Which customers have the highest credit risk based on their prediction scores?"
                ]
              },
              {
                "id": "ae88547320504342a1ec21755334c8ac",
                "question": [
                  "Show me the total credit overdue amounts by customer"
                ]
              },
              {
                "id": "8dd2dec379264f06a788974f686c81d1",
                "question": [
                  "What are the average tenure and revenue for customers grouped by education level?"
                ]
              },
              {
                "id": "469607a455d042128406ea1fb28bc576",
                "question": [
                  "Which customers have the highest transaction volume in the last 12 months?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.catalog}.fsi_credit.credit_bureau_gold",
                "column_configs": [

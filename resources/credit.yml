                "id": "4b19f4a74c0549e48ba3ad0ce1915d69",
                "content": [
                  "This Genie space helps analysts explore credit decisioning data. It covers customer profiles, credit bureau history, fund transactions, telco data, engineered features, and model predictions for underbanked customer identification.",
                  "Join tables on customer ID: customer_gold.id = credit_bureau_gold.CUST_ID = fund_trans_gold.cust_id = telco_gold.cust_id = credit_decisioning_features.cust_id = underbanked_prediction.cust_id",
                  "The underbanked_prediction table contains the model output. The 'prediction' column indicates whether the customer is predicted to be underbanked (1) or not (0). Use credit_decisioning_features for the input features used by the model."

# ============================================================================
# Genie spaces (inline serialized_space so ${var.catalog} is substituted at
# deploy time -- GenieSpace has no dataset_catalog field and file_path is not
# substituted, so the content must live in YAML).
# ============================================================================
resources:
  genie_spaces:
    portfolio_assistant_genie:
      title: "[FSI Demo Pack] - Portfolio Assistant"
      description: "Easily analyze your portfolio performance and market trends using the GenAI Assistant."
      warehouse_id: ${var.warehouse_id}
      serialized_space: |-
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "q1_portfolio_top",
                "question": [
                  "What are the top 5 companies in my portfolio by market capitalization?"
                ]
              },
              {
                "id": "q2_volatility",
                "question": [
                  "Show me market volatility during the 2008 financial crisis"
                ]
              },
              {
                "id": "q3_sentiment",
                "question": [
                  "What is the sentiment distribution for technology stocks?"
                ]
              },
              {
                "id": "q4_negative_news",
                "question": [
                  "What are the latest negative news events impacting my portfolio?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.portfolio",
                "column_configs": [
                  {
                    "column_name": "ticker"
                  },
                  {
                    "column_name": "company_name"
                  },
                  {
                    "column_name": "industry"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.fundamentals",
                "column_configs": [
                  {
                    "column_name": "ticker"
                  },
                  {
                    "column_name": "market_capitalization"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.prices",
                "column_configs": [
                  {
                    "column_name": "ticker"
                  },
                  {
                    "column_name": "date"
                  },
                  {
                    "column_name": "close"
                  },
                  {
                    "column_name": "return"
                  },
                  {
                    "column_name": "split_factor"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.news",
                "column_configs": [
                  {
                    "column_name": "article_id"
                  },
                  {
                    "column_name": "title"
                  },
                  {
                    "column_name": "published_time"
                  },
                  {
                    "column_name": "sentiment"
                  },
                  {
                    "column_name": "market_sentiment"
                  },
                  {
                    "column_name": "source"
                  },
                  {
                    "column_name": "source_url"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_portfolio_assistant.news_ticker",
                "column_configs": [
                  {
                    "column_name": "article_id"
                  },
                  {
                    "column_name": "ticker"
                  }
                ]
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "instr_context",
                "content": [
                  "This Genie space helps portfolio managers analyze their investment portfolio performance and market trends. The data covers stock prices, company fundamentals, and financial news with sentiment analysis."
                ]
              },
              {
                "id": "instr_joins",
                "content": [
                  "Join portfolio to prices on ticker. Join portfolio to fundamentals on ticker. Join news to news_ticker on article_id. Join news_ticker to portfolio on ticker."
                ]
              }
            ]
          }
        }
      permissions:
        - level: CAN_RUN
          group_name: users
    credit_decisioning_genie:
      title: "[FSI Demo Pack] - Credit Decisioning"
      description: "Analyze credit decisioning data with the GenAI Assistant: customer profiles, credit bureau data, model explanations and features."
      warehouse_id: ${var.warehouse_id}
      serialized_space: |-
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "q1_high_risk",
                "question": [
                  "Which customers have the highest credit risk based on their prediction scores?"
                ]
              },
              {
                "id": "q2_overdue",
                "question": [
                  "Show me the total credit overdue amounts by customer"
                ]
              },
              {
                "id": "q3_features",
                "question": [
                  "What are the average tenure and revenue for customers grouped by education level?"
                ]
              },
              {
                "id": "q4_transactions",
                "question": [
                  "Which customers have the highest transaction volume in the last 12 months?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.catalog}.fsi_credit.customer_gold",
                "column_configs": [
                  {
                    "column_name": "id"
                  },
                  {
                    "column_name": "first_name"
                  },
                  {
                    "column_name": "last_name"
                  },
                  {
                    "column_name": "email"
                  },
                  {
                    "column_name": "gender"
                  },
                  {
                    "column_name": "city"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.credit_bureau_gold",
                "column_configs": [
                  {
                    "column_name": "CUST_ID"
                  },
                  {
                    "column_name": "AMT_CREDIT_SUM"
                  },
                  {
                    "column_name": "AMT_CREDIT_SUM_DEBT"
                  },
                  {
                    "column_name": "AMT_CREDIT_SUM_OVERDUE"
                  },
                  {
                    "column_name": "AMT_CREDIT_MAX_OVERDUE"
                  },
                  {
                    "column_name": "CREDIT_ACTIVE"
                  },
                  {
                    "column_name": "CREDIT_DAY_OVERDUE"
                  },
                  {
                    "column_name": "CNT_CREDIT_PROLONG"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.fund_trans_gold",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "sent_txn_cnt_12m"
                  },
                  {
                    "column_name": "sent_txn_amt_12m"
                  },
                  {
                    "column_name": "rcvd_txn_cnt_12m"
                  },
                  {
                    "column_name": "rcvd_txn_amt_12m"
                  },
                  {
                    "column_name": "dist_payer_cnt_12m"
                  },
                  {
                    "column_name": "dist_payee_cnt_12m"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.telco_gold",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "avg_phone_bill_amt_lst12mo"
                  },
                  {
                    "column_name": "number_payment_delays_last12mo"
                  },
                  {
                    "column_name": "phone_bill_amt"
                  },
                  {
                    "column_name": "is_pre_paid"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.credit_decisioning_features",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "education"
                  },
                  {
                    "column_name": "marital_status"
                  },
                  {
                    "column_name": "months_employment"
                  },
                  {
                    "column_name": "tenure_months"
                  },
                  {
                    "column_name": "product_cnt"
                  },
                  {
                    "column_name": "tot_rel_bal"
                  },
                  {
                    "column_name": "revenue_tot"
                  }
                ]
              },
              {
                "identifier": "${var.catalog}.fsi_credit.underbanked_prediction",
                "column_configs": [
                  {
                    "column_name": "cust_id"
                  },
                  {
                    "column_name": "education"
                  },
                  {
                    "column_name": "tenure_months"
                  },
                  {
                    "column_name": "tot_rel_bal"
                  },
                  {
                    "column_name": "revenue_tot"
                  },
                  {
                    "column_name": "prediction"
                  }
                ]
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "instr_context",
                "content": [
                  "This Genie space helps analysts explore credit decisioning data. It covers customer profiles, credit bureau history, fund transactions, telco data, engineered features, and model predictions for underbanked customer identification."
                ]
              },
              {
                "id": "instr_joins",
                "content": [
                  "Join tables on customer ID: customer_gold.id = credit_bureau_gold.CUST_ID = fund_trans_gold.cust_id = telco_gold.cust_id = credit_decisioning_features.cust_id = underbanked_prediction.cust_id"
                ]
              },
              {
                "id": "instr_prediction",
                "content": [
                  "The underbanked_prediction table contains the model output. The 'prediction' column indicates whether the customer is predicted to be underbanked (1) or not (0). Use credit_decisioning_features for the input features used by the model."
                ]
              }
            ]
          }
        }
      permissions:
        - level: CAN_RUN
          group_name: users

    smart_claims_investigation_dashboard:
      display_name: "[FSI Demo Pack] - Smart Claims Investigation"
      warehouse_id: ${var.warehouse_id}
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "294be7b1",
              "displayName": "loss_ratio_liability",
              "queryLines": [
                "SELECT\n",
                "  round(c.total_claims / p.total_premium, 2) AS loss_ratio\n",
                "FROM\n",
                "  (\n",
                "    SELECT\n",
                "      round(curr.total_premium, 0) as total_premium\n",
                "    FROM\n",
                "      (\n",
                "        SELECT\n",
                "          sum(premium * months_active) AS total_premium\n",
                "        FROM\n",
                "          (\n",
                "            SELECT\n",
                "              pol_eff_date,\n",
                "              pol_expiry_date,\n",
                "              premium,\n",
                "              round(months_between(pol_expiry_date, pol_eff_date), 0) AS months_active\n",
                "            FROM\n",
                "              `${var.catalog}`.`fsi_smart_claims`.policy\n",
                "            WHERE\n",
                "              pol_issue_date BETWEEN :start_date\n",
                "              AND :end_date\n",
                "          )\n",
                "        WHERE\n",
                "          months_active > 0\n",
                "      ) curr\n",
                "      JOIN (\n",
                "        SELECT\n",
                "          sum(premium * months_active) AS total_premium\n",
                "        FROM\n",
                "          (\n",
                "            SELECT\n",
                "              pol_eff_date,\n",
                "              pol_expiry_date,\n",
                "              premium,\n",
                "              round(months_between(pol_expiry_date, pol_eff_date), 0) AS months_active\n",
                "            FROM\n",
                "              `${var.catalog}`.`fsi_smart_claims`.policy\n",
                "            WHERE\n",
                "              pol_issue_date BETWEEN date_sub(\n",
                "                :start_date,\n",
                "                datediff(:end_date, :start_date)\n",
                "              )\n",
                "              AND date_sub(\n",
                "                :end_date,\n",
                "                datediff(:end_date, :start_date)\n",
                "              )\n",
                "          )\n",
                "        WHERE\n",
                "          months_active > 0\n",
                "      ) prev\n",
                "  ) p\n",
                "  JOIN (\n",
                "    SELECT\n",
                "      round(curr.total_claims, 0) AS total_claims\n",
                "    FROM\n",
                "      (\n",
                "        SELECT\n",
                "          sum(claim_amount_injury) AS total_claims\n",
                "        FROM\n",
                "          `${var.catalog}`.`fsi_smart_claims`.claim\n",
                "        WHERE\n",
                "          claim_date BETWEEN :start_date\n",
                "          AND :end_date\n",
                "      ) curr\n",
                "  ) c;"
              ],
              "parameters": [
                {
                  "displayName": "start_date",
                  "keyword": "start_date",
                  "dataType": "DATE",
                  "defaultSelection": {
                    "values": {
                      "dataType": "DATE",
                      "values": [
                        {
                          "value": "2015-01-01"
                        }
                      ]
                    }
                  }
                },
                {
                  "displayName": "end_date",
                  "keyword": "end_date",
                  "dataType": "DATE",
                  "defaultSelection": {
                    "values": {
                      "dataType": "DATE",
                      "values": [
                        {
                          "value": "2021-05-01"
                        }
                      ]
                    }
                  }
                }
              ]
            },
            {
              "name": "ce8a3ca1",
              "displayName": "Claim - vehicleAge",
              "queryLines": [
                "SELECT\n",
                "  COUNT(*) AS count,\n",
                "  make,\n",
                "  model_year\n",
                "FROM\n",
                "  `${var.catalog}`.`fsi_smart_claims`.claim_insights\n",
                "GROUP BY\n",
                "  make,\n",
                "  model_year"

# ============================================================================
# Dashboards (inline serialized_dashboard so ${var.catalog} is substituted at
# deploy time by `databricks bundle deploy` -- file_path is NOT substituted).
# ============================================================================
resources:
  dashboards:
    credit_decisioning_dashboard:
      display_name: "[FSI Demo Pack] - Credit Decisioning"
      warehouse_id: ${var.warehouse_id}
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "51046c79",
              "displayName": "CreditDecisioning_PredictedCLTV",
              "queryLines": [
                "select\n",
                "  (\n",
                "    select\n",
                "      sum(revenue_tot) / count(*)\n",
                "    from\n",
                "      `${var.catalog}`.`fsi_credit`.customer_gold\n",
                "  ) * (\n",
                "    select\n",
                "      countunderbanked\n",
                "    from\n",
                "      (\n",
                "        select\n",
                "          count(*) countunderbanked\n",
                "        from\n",
                "          `${var.catalog}`.`fsi_credit`.underbanked_prediction as p\n",
                "          left join `${var.catalog}`.`fsi_credit`.credit_bureau_gold b using (cust_id)\n",
                "        where\n",
                "          b.CREDIT_DAY_OVERDUE is null\n",
                "          and prediction == 0\n",
                "      )\n",
                "  ) as total_projected_revenue"
              ]
            },
            {
              "name": "d1772421",
              "displayName": "CreditDecisioning_DefaultedAmt",
              "queryLines": [
                "select sum(AMT_CREDIT_MAX_OVERDUE) from `${var.catalog}`.`fsi_credit`.credit_bureau_gold"
              ]
            },
            {
              "name": "d7d780f2",
              "displayName": "creditdecisioning_fielddemo_feature_importance",
              "queryLines": [
                "WITH tableA AS\n",
                "(SELECT avg(abs(education_shap)) education, \n",
                "\t\t\t avg(abs(marital_status_shap)) marital_status, \n",
                "\t\t\t avg(abs(months_current_address_shap)) months_current_address,\n",
                "       avg(abs(months_employment_shap)) months_employment, \n",
                "       avg(abs(is_resident_shap)) is_resident, \n",
                "       avg(abs(tenure_months_shap)) tenure_months,\n",
                "       avg(abs(product_cnt_shap)) product_cnt, \n",
                "       avg(abs(tot_rel_bal_shap)) tot_rel_bal, \n",
                "       avg(abs(revenue_tot_shap)) revenue_tot,\n",
                "       avg(abs(revenue_12m_shap)) revenue_12m, \n",
                "       avg(abs(income_annual_shap)) income_annual, \n",
                "       avg(abs(tot_assets_shap)) tot_assets,\n",
                "       avg(abs(overdraft_balance_amount_shap)) overdraft_balance_amount, \n",
                "       avg(abs(overdraft_number_shap)) overdraft_number,\n",
                "       avg(abs(total_deposits_number_shap)) total_deposits_number, \n",
                "       avg(abs(total_deposits_amount_shap)) total_deposits_amount,\n",
                "       avg(abs(total_equity_amount_shap)) total_equity_amount, \n",
                "       avg(abs(total_UT_shap)) total_UT, \n",
                "       avg(abs(customer_revenue_shap)) customer_revenue,\n",
                "       avg(abs(age_shap)) age, \n",
                "       avg(abs(avg_balance_shap)) avg_balance, \n",
                "       avg(abs(num_accs_shap)) num_accs, \n",
                "       avg(abs(balance_usd_shap)) balance_usd,\n",
                "       avg(abs(available_balance_usd_shap)) available_balance_usd, \n",
                "       avg(abs(is_pre_paid_shap)) is_pre_paid,\n",
                "       avg(abs(number_payment_delays_last12mo_shap)) number_payment_delays_last12mo,\n",
                "       avg(abs(pct_increase_annual_number_of_delays_last_3_year_shap)) pct_increase_annual_number_of_delays_last_3_year,\n",
                "       avg(abs(phone_bill_amt_shap)) phone_bill_amt, \n",
                "       avg(abs(avg_phone_bill_amt_lst12mo_shap)) avg_phone_bill_amt_lst12mo,\n",
                "       avg(abs(dist_payee_cnt_12m_shap)) dist_payee_cnt_12m, \n",
                "       avg(abs(sent_txn_cnt_12m_shap)) sent_txn_cnt_12m,\n",
                "       avg(abs(sent_txn_amt_12m_shap)) sent_txn_amt_12m, \n",
                "       avg(abs(sent_amt_avg_12m_shap)) sent_amt_avg_12m,\n",
                "       avg(abs(dist_payer_cnt_12m_shap)) dist_payer_cnt_12m, \n",
                "       avg(abs(rcvd_txn_cnt_12m_shap)) rcvd_txn_cnt_12m,\n",
                "       avg(abs(rcvd_txn_amt_12m_shap)) rcvd_txn_amt_12m, \n",
                "       avg(abs(rcvd_amt_avg_12m_shap)) rcvd_amt_avg_12m,\n",
                "       avg(abs(dist_payee_cnt_6m_shap)) dist_payee_cnt_6m, \n",
                "       avg(abs(sent_txn_cnt_6m_shap)) sent_txn_cnt_6m,\n",
                "       avg(abs(sent_txn_amt_6m_shap)) sent_txn_amt_6m, \n",
                "       avg(abs(sent_amt_avg_6m_shap)) sent_amt_avg_6m,\n",
                "       avg(abs(dist_payer_cnt_6m_shap)) dist_payer_cnt_6m, \n",
                "       avg(abs(rcvd_txn_cnt_6m_shap)) rcvd_txn_cnt_6m,\n",
                "       avg(abs(rcvd_txn_amt_6m_shap)) rcvd_txn_amt_6m, \n",
                "       avg(abs(rcvd_amt_avg_6m_shap)) rcvd_amt_avg_6m,\n",
                "       avg(abs(dist_payee_cnt_3m_shap)) dist_payee_cnt_3m, \n",
                "       avg(abs(sent_txn_cnt_3m_shap)) sent_txn_cnt_3m,\n",
                "       avg(abs(sent_txn_amt_3m_shap)) sent_txn_amt_3m, \n",
                "       avg(abs(sent_amt_avg_3m_shap)) sent_amt_avg_3m,\n",
                "       avg(abs(dist_payer_cnt_3m_shap)) dist_payer_cnt_3m, \n",
                "       avg(abs(rcvd_txn_cnt_3m_shap)) rcvd_txn_cnt_3m,\n",
                "       avg(abs(rcvd_txn_amt_3m_shap)) rcvd_txn_amt_3m, \n",
                "       avg(abs(rcvd_amt_avg_3m_shap)) rcvd_amt_avg_3m, \n",
                "       avg(abs(tot_txn_cnt_12m_shap)) tot_txn_cnt_12m,\n",
                "       avg(abs(tot_txn_cnt_6m_shap)) tot_txn_cnt_6m, \n",
                "       avg(abs(tot_txn_cnt_3m_shap)) tot_txn_cnt_3m, \n",
                "       avg(abs(tot_txn_amt_12m_shap)) tot_txn_amt_12m,\n",
                "       avg(abs(tot_txn_amt_6m_shap)) tot_txn_amt_6m, \n",
                "       avg(abs(tot_txn_amt_3m_shap)) tot_txn_amt_3m,\n",
                "       avg(abs(ratio_txn_amt_3m_12m_shap)) ratio_txn_amt_3m_12m, \n",
                "       avg(abs(ratio_txn_amt_6m_12m_shap)) ratio_txn_amt_6m_12m\n",
                "       FROM `${var.catalog}`.`fsi_credit`.shap_explanation) \n",
                "SELECT feature, mean_absolute_shap_value\n",
                "FROM (\n",
                "  SELECT *\n",
                "  FROM (\n",
                "    SELECT *\n",
                "    FROM tableA\n",
                "    LIMIT 1\n",
                "  ) sub1\n",
                "  UNPIVOT (\n",
                "    mean_absolute_shap_value FOR feature IN (\n",
                "      education, marital_status, months_current_address, months_employment, is_resident, tenure_months, product_cnt, tot_rel_bal, revenue_tot, revenue_12m, income_annual, tot_assets, overdraft_balance_amount, overdraft_number, total_deposits_number, total_deposits_amount, total_equity_amount, total_UT, customer_revenue, age, avg_balance, num_accs, balance_usd, available_balance_usd, is_pre_paid, number_payment_delays_last12mo, pct_increase_annual_number_of_delays_last_3_year, phone_bill_amt, avg_phone_bill_amt_lst12mo, dist_payee_cnt_12m, sent_txn_cnt_12m, sent_txn_amt_12m, sent_amt_avg_12m, dist_payer_cnt_12m, rcvd_txn_cnt_12m, rcvd_txn_amt_12m, rcvd_amt_avg_12m, dist_payee_cnt_6m, sent_txn_cnt_6m, sent_txn_amt_6m, sent_amt_avg_6m, dist_payer_cnt_6m, rcvd_txn_cnt_6m, rcvd_txn_amt_6m, rcvd_amt_avg_6m, dist_payee_cnt_3m, sent_txn_cnt_3m, sent_txn_amt_3m, sent_amt_avg_3m, dist_payer_cnt_3m, rcvd_txn_cnt_3m, rcvd_txn_amt_3m, rcvd_amt_avg_3m, tot_txn_cnt_12m, tot_txn_cnt_6m, tot_txn_cnt_3m, tot_txn_amt_12m, tot_txn_amt_6m, tot_txn_amt_3m, ratio_txn_amt_3m_12m, ratio_txn_amt_6m_12m\n",
                "    )\n",
                "  ) sub2\n",
                ") sub3\n",
                "ORDER BY mean_absolute_shap_value DESC LIMIT 10\n"
              ]
            },
            {
              "name": "c8cf4efe",
              "displayName": "creditdecisioning_fielddemo_candidates",
              "queryLines": [
                "WITH main_table AS\n",
                "(SELECT col_names.cust_id AS Customer_ID, concat(col_names.first_name, \" \", col_names.last_name) AS Name, col_names.email AS Email, col_names.mobile_phone AS Mobile_Phone, col_names.default_prob AS Default_probability, REPLACE(val1_col, '_shap', '') AS feature1, REPLACE(val2_col, '_shap', '') AS feature2, REPLACE(val3_col, '_shap', '') AS feature3\n",
                "FROM (\n",
                "  SELECT cust_id,\n",
                "    MIN(CASE WHEN col_num = 1 THEN val ELSE NULL END) AS val1,\n",
                "    MIN(CASE WHEN col_num = 2 THEN val ELSE NULL END) AS val2,\n",
                "    MIN(CASE WHEN col_num = 3 THEN val ELSE NULL END) AS val3\n",
                "  FROM (\n",
                "    SELECT cust_id, val, \n",
                "      ROW_NUMBER() OVER (PARTITION BY cust_id ORDER BY val ASC) AS col_num,\n",
                "      COLUMN_NAME\n",
                "    FROM (\n",
                "      SELECT cust_id, val, COLUMN_NAME\n",
                "      FROM `${var.catalog}`.`fsi_credit`.shap_explanation\n",
                "      UNPIVOT (\n",
                "        val FOR COLUMN_NAME IN (\n",
                "          education_shap, marital_status_shap, months_current_address_shap, \n",
                "\t\t\t\tmonths_employment_shap, is_resident_shap, tenure_months_shap, \n",
                "\t\t\t\tproduct_cnt_shap, tot_rel_bal_shap, revenue_tot_shap, \n",
                "\t\t\t\trevenue_12m_shap, income_annual_shap, tot_assets_shap, \n",
                "\t\t\t\toverdraft_balance_amount_shap, overdraft_number_shap, \n",
                "\t\t\t\ttotal_deposits_number_shap, total_deposits_amount_shap, \n",
                "\t\t\t\ttotal_equity_amount_shap, total_UT_shap, customer_revenue_shap, \n",
                "\t\t\t\tage_shap, avg_balance_shap, num_accs_shap, balance_usd_shap, \n",
                "\t\t\t\tavailable_balance_usd_shap, is_pre_paid_shap, \n",
                "\t\t\t\tnumber_payment_delays_last12mo_shap, \n",
                "\t\t\t\tpct_increase_annual_number_of_delays_last_3_year_shap, \n",
                "\t\t\t\tphone_bill_amt_shap, avg_phone_bill_amt_lst12mo_shap, \n",
                "\t\t\t\tdist_payee_cnt_12m_shap, sent_txn_cnt_12m_shap, \n",
                "\t\t\t\tsent_txn_amt_12m_shap, sent_amt_avg_12m_shap, \n",
                "\t\t\t\tdist_payer_cnt_12m_shap, rcvd_txn_cnt_12m_shap, \n",
                "\t\t\t\trcvd_txn_amt_12m_shap, rcvd_amt_avg_12m_shap, \n",
                "\t\t\t\tdist_payee_cnt_6m_shap, sent_txn_cnt_6m_shap, \n",
                "\t\t\t\tsent_txn_amt_6m_shap, sent_amt_avg_6m_shap, \n",
                "\t\t\t\tdist_payer_cnt_6m_shap, rcvd_txn_cnt_6m_shap, \n",
                "\t\t\t\trcvd_txn_amt_6m_shap, rcvd_amt_avg_6m_shap, \n",
                "\t\t\t\tdist_payee_cnt_3m_shap, sent_txn_cnt_3m_shap, \n",
                "\t\t\t\tsent_txn_amt_3m_shap, sent_amt_avg_3m_shap, \n",
                "\t\t\t\tdist_payer_cnt_3m_shap, rcvd_txn_cnt_3m_shap, \n",
                "\t\t\t\trcvd_txn_amt_3m_shap, rcvd_amt_avg_3m_shap, tot_txn_cnt_12m_shap, \n",
                "\t\t\t\ttot_txn_cnt_6m_shap, tot_txn_cnt_3m_shap, tot_txn_amt_12m_shap, \n",
                "\t\t\t\ttot_txn_amt_6m_shap, tot_txn_amt_3m_shap, \n",
                "\t\t\t\tratio_txn_amt_3m_12m_shap, ratio_txn_amt_6m_12m_shap\n",
                "\t\t\t\t)\n",
                "      ) WHERE prediction==0\n",
                "    ) AS unpivoted\n",
                "  ) AS ranked\n",
                "  WHERE col_num <= 3\n",
                "  GROUP BY cust_id\n",
                ") AS top3\n",
                "LEFT JOIN (\n",
                "  SELECT cust_id, first_name, last_name, email, mobile_phone, default_prob, prediction,\n",
                "    MIN(CASE WHEN col_num = 1 THEN COLUMN_NAME ELSE NULL END) AS val1_col,\n",
                "    MIN(CASE WHEN col_num = 2 THEN COLUMN_NAME ELSE NULL END) AS val2_col,\n",
                "    MIN(CASE WHEN col_num = 3 THEN COLUMN_NAME ELSE NULL END) AS val3_col\n",
                "  FROM (\n",
                "    SELECT cust_id, val, first_name, last_name, email, mobile_phone, default_prob, prediction,\n",
                "      ROW_NUMBER() OVER (PARTITION BY cust_id ORDER BY val ASC) AS col_num,\n",
                "      COLUMN_NAME\n",
                "    FROM (\n",
                "      SELECT cust_id, val, COLUMN_NAME, first_name, last_name, email, mobile_phone, default_prob, prediction\n",
                "      FROM `${var.catalog}`.`fsi_credit`.shap_explanation\n",
                "      UNPIVOT (\n",
                "        val FOR COLUMN_NAME IN (\n",
                "          education_shap, marital_status_shap, months_current_address_shap, \n",
                "\t\t\t\tmonths_employment_shap, is_resident_shap, tenure_months_shap, \n",
                "\t\t\t\tproduct_cnt_shap, tot_rel_bal_shap, revenue_tot_shap, \n",
                "\t\t\t\trevenue_12m_shap, income_annual_shap, tot_assets_shap, \n",
                "\t\t\t\toverdraft_balance_amount_shap, overdraft_number_shap, \n",
                "\t\t\t\ttotal_deposits_number_shap, total_deposits_amount_shap, \n",
                "\t\t\t\ttotal_equity_amount_shap, total_UT_shap, customer_revenue_shap, \n",
                "\t\t\t\tage_shap, avg_balance_shap, num_accs_shap, balance_usd_shap, \n",
                "\t\t\t\tavailable_balance_usd_shap, is_pre_paid_shap, \n",
                "\t\t\t\tnumber_payment_delays_last12mo_shap, \n",
                "\t\t\t\tpct_increase_annual_number_of_delays_last_3_year_shap, \n",
                "\t\t\t\tphone_bill_amt_shap, avg_phone_bill_amt_lst12mo_shap, \n",
                "\t\t\t\tdist_payee_cnt_12m_shap, sent_txn_cnt_12m_shap, \n",
                "\t\t\t\tsent_txn_amt_12m_shap, sent_amt_avg_12m_shap, \n",
                "\t\t\t\tdist_payer_cnt_12m_shap, rcvd_txn_cnt_12m_shap, \n",
                "\t\t\t\trcvd_txn_amt_12m_shap, rcvd_amt_avg_12m_shap, \n",
                "\t\t\t\tdist_payee_cnt_6m_shap, sent_txn_cnt_6m_shap, \n",
                "\t\t\t\tsent_txn_amt_6m_shap, sent_amt_avg_6m_shap, \n",
                "\t\t\t\tdist_payer_cnt_6m_shap, rcvd_txn_cnt_6m_shap, \n",
                "\t\t\t\trcvd_txn_amt_6m_shap, rcvd_amt_avg_6m_shap, \n",
                "\t\t\t\tdist_payee_cnt_3m_shap, sent_txn_cnt_3m_shap, \n",
                "\t\t\t\tsent_txn_amt_3m_shap, sent_amt_avg_3m_shap, \n",
                "\t\t\t\tdist_payer_cnt_3m_shap, rcvd_txn_cnt_3m_shap, \n",
                "\t\t\t\trcvd_txn_amt_3m_shap, rcvd_amt_avg_3m_shap, tot_txn_cnt_12m_shap, \n",
                "\t\t\t\ttot_txn_cnt_6m_shap, tot_txn_cnt_3m_shap, tot_txn_amt_12m_shap, \n",
                "\t\t\t\ttot_txn_amt_6m_shap, tot_txn_amt_3m_shap, \n",
                "\t\t\t\tratio_txn_amt_3m_12m_shap, ratio_txn_amt_6m_12m_shap\n",
                "\t\t\t\t)\n",
                "      ) WHERE prediction==0\n",
                "    ) AS unpivoted\n",
                "  ) AS ranked\n",
                "  WHERE col_num <= 3\n",
                "  GROUP BY cust_id, first_name, last_name, email, mobile_phone, default_prob, prediction\n",
                ") AS col_names\n",
                "ON top3.cust_id = col_names.cust_id\n",
                "ORDER BY default_prob),\n",
                "\n",
                "feature_definitions AS\n",
                "(SELECT * FROM `${var.catalog}`.`fsi_credit`.feature_definitions)\n",
                "\n",
                "SELECT Customer_ID, Name, Email, Mobile_phone, Default_probability, f1.definition AS Top_reason_1, f2.definition AS Top_reason_2, f3.definition AS Top_reason_3 FROM main_table\n",
                "LEFT JOIN feature_definitions AS f1\n",
                "ON  main_table.feature1 = f1.feature\n",
                "LEFT JOIN feature_definitions AS f2\n",
                "ON  main_table.feature2 = f2.feature\n",
                "LEFT JOIN feature_definitions AS f3\n",
                "ON  main_table.feature3 = f3.feature"
              ]
            },
            {
              "name": "f2f14d1d",
              "displayName": "creditdecisioning_fielddemo_group_difference_features",
              "queryLines": [
                "WITH tableA AS\n",
                "(SELECT gender, \n",
                "\t\t\t AVG(education_shap) education_avg_shap,\n",
                "\t\t\t AVG(marital_status_shap) marital_status_avg_shap,\n",
                "\t\t\t AVG(months_employment_shap) months_employment_avg_shap,\n",
                "\t\t\t AVG(is_resident_shap) is_resident_avg_shap\n",
                "FROM `${var.catalog}`.`fsi_credit`.shap_explanation\n",
                "GROUP BY gender)\n",
                "SELECT\n",
                "    'education' feature, \n",
                "    (SELECT education_avg_shap FROM tableA WHERE gender = 'Male') - \n",
                "    (SELECT education_avg_shap FROM tableA WHERE gender = 'Female') avg_shap_diff\n",
                "UNION ALL\n",
                "SELECT \n",
                "    'marital_status' feature, \n",
                "    (SELECT marital_status_avg_shap FROM tableA WHERE gender = 'Male') - \n",
                "    (SELECT marital_status_avg_shap FROM tableA WHERE gender = 'Female') avg_shap_diff\n",
                "UNION ALL\n",
                "SELECT \n",
                "    'months_employment' feature, \n",
                "    (SELECT months_employment_avg_shap FROM tableA WHERE gender = 'Male') - \n",
                "    (SELECT months_employment_avg_shap FROM tableA WHERE gender = 'Female') avg_shap_diff\n",
                "UNION ALL\n",
                "SELECT \n",
                "    'is_resident' feature, \n",
                "    (SELECT is_resident_avg_shap FROM tableA WHERE gender = 'Male') - \n",
                "    (SELECT is_resident_avg_shap FROM tableA WHERE gender = 'Female') avg_shap_diff"
              ]
            },
            {
              "name": "70a9c894",
              "displayName": "CreditDecisioning_RiskProfile",
              "queryLines": [
                "SELECT c.last_name, c.first_name, c.email, c.cust_id, s.default_prob, c.loan_balance_amount, c.is_resident\n",
                "   FROM `${var.catalog}`.`fsi_credit`.shap_explanation s\n",
                "   inner join `${var.catalog}`.`fsi_credit`.customer_gold c using(cust_id)\n",
                "      order by default_prob"
              ]
            },
            {
              "name": "5f40bca0",
              "displayName": "CreditDecisioning_newlydefaulted",
              "queryLines": [
                "SELECT count(*) as number_newly_defaulter FROM `${var.catalog}`.`fsi_credit`.credit_bureau_gold"
              ]
            },
            {
              "name": "6ecd2272",
              "displayName": "CreditDecisioning_CLTV",
              "queryLines": [
                "select\n",
                "  sum(revenue_tot) / count(*)\n",
                "from\n",
                "  `${var.catalog}`.`fsi_credit`.customer_gold"
              ]
            },
            {
              "name": "bf744c03",
              "displayName": "creditdecisioning_fielddemo_group_difference",
              "queryLines": [
                "WITH tableA AS\n",
                "(SELECT gender, \n",
                "\t\t\t AVG((education_shap + marital_status_shap + months_current_address_shap + \n",
                "\t\t\t\tmonths_employment_shap + is_resident_shap + tenure_months_shap + \n",
                "\t\t\t\tproduct_cnt_shap + tot_rel_bal_shap + revenue_tot_shap + \n",
                "\t\t\t\trevenue_12m_shap + income_annual_shap + tot_assets_shap + \n",
                "\t\t\t\toverdraft_balance_amount_shap + overdraft_number_shap + \n",
                "\t\t\t\ttotal_deposits_number_shap + total_deposits_amount_shap + \n",
                "\t\t\t\ttotal_equity_amount_shap + total_UT_shap + customer_revenue_shap + \n",
                "\t\t\t\tage_shap + avg_balance_shap + num_accs_shap + balance_usd_shap + \n",
                "\t\t\t\tavailable_balance_usd_shap + is_pre_paid_shap + \n",
                "\t\t\t\tnumber_payment_delays_last12mo_shap + \n",
                "\t\t\t\tpct_increase_annual_number_of_delays_last_3_year_shap + \n",
                "\t\t\t\tphone_bill_amt_shap + avg_phone_bill_amt_lst12mo_shap + \n",
                "\t\t\t\tdist_payee_cnt_12m_shap + sent_txn_cnt_12m_shap + \n",

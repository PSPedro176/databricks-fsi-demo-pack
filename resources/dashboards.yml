    portfolio_assistant_dashboard:
      display_name: "[FSI Demo Pack] - Portfolio Assistant"
      warehouse_id: ${var.warehouse_id}
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "65406851",
              "displayName": "top portfolio",
              "queryLines": [
                "SELECT\n",
                "  p.ticker,\n",
                "  p.company_name,\n",
                "  f.market_capitalization\n",
                "FROM\n",
                "  `${var.catalog}`.`fsi_portfolio_assistant`.portfolio p\n",
                "  JOIN `${var.catalog}`.`fsi_portfolio_assistant`.fundamentals f ON p.ticker = f.ticker\n",
                "ORDER BY\n",
                "  f.market_capitalization DESC\n",
                "LIMIT\n",
                "  5"
              ]
            },
            {
              "name": "40364842",
              "displayName": "ticker over time",
              "queryLines": [
                "with splits as (\n",
                "    select\n",
                "      ticker,\n",
                "      date as split_date,\n",
                "      1/split_factor as adjustment\n",
                "      from `${var.catalog}`.`fsi_portfolio_assistant`.prices where split_factor > 1 \n",
                ")\n",
                "\n",
                "select p.date,\n",
                "       p.ticker, \n",
                "       p.close,\n",
                "       coalesce(\n",
                "         exp(\n",
                "           sum(ln(s.adjustment)) \n",
                "             over (partition by p.ticker\n",
                "                       order by p.date desc\n",
                "                rows between unbounded preceding\n",
                "                         and 1 preceding)\n",
                "         ), 1\n",
                "       ) * p.close as adjusted_close\n",
                "  from `${var.catalog}`.`fsi_portfolio_assistant`.prices p\n",
                "       left join splits s \n",
                "              on s.ticker = p.ticker \n",
                "             and s.split_date = p.date;"
              ]
            },
            {
              "name": "3c85b0a3",
              "displayName": "volatility on crisis",
              "queryLines": [
                "SELECT\n",
                "  date_sub (date, DAYOFWEEK (date) - 1) AS week_start,\n",
                "  STDDEV (`return`) AS volatility\n",
                "FROM\n",
                "  `${var.catalog}`.`fsi_portfolio_assistant`.prices p\n",
                "  JOIN `${var.catalog}`.`fsi_portfolio_assistant`.portfolio po ON p.ticker = po.ticker\n",
                "WHERE\n",
                "  po.industry = 'Technology'\n",
                "  AND date BETWEEN '2007-12-01' AND '2009-06-30'\n",
                "GROUP BY\n",
                "  week_start\n",
                "ORDER BY\n",
                "  week_start"
              ]
            },
            {
              "name": "d23afca8",
              "displayName": "distinct tickers",
              "queryLines": [
                "-- SELECT DISTINCT(ticker) FROM `${var.catalog}`.`fsi_portfolio_assistant`.prices\n",
                "SELECT date, close, ticker FROM `${var.catalog}`.`fsi_portfolio_assistant`.prices"
              ]
            },
            {
              "name": "edb591bb",
              "displayName": "Top sentiment",
              "queryLines": [
                "SELECT\n",
                "  p.industry,\n",
                "  nt.ticker,\n",
                "  DATE_FORMAT(n.published_time, 'yyyy-MM-dd') as date,\n",
                "  n.market_sentiment,\n",
                "  COUNT(*) as sentiment_count\n",
                "FROM\n",
                "  `${var.catalog}`.`fsi_portfolio_assistant`.news_ticker nt\n",
                "  JOIN `${var.catalog}`.`fsi_portfolio_assistant`.news n ON nt.article_id = n.article_id\n",
                "  JOIN `${var.catalog}`.`fsi_portfolio_assistant`.portfolio p ON nt.ticker = p.ticker\n",
                "GROUP BY\n",
                "  nt.ticker,\n",
                "  date,\n",
                "  n.market_sentiment,\n",
                "  p.industry"
              ]
            },
            {
              "name": "432ab0f7",
              "displayName": "Market negative event",
              "queryLines": [
                "SELECT\n",
                "  n.article_id,\n",
                "  n.title,\n",
                "  DATE_FORMAT(n.published_time, 'yyyy-MM-dd') AS published_date,\n",
                "  n.source,\n",
                "  n.source_url\n",
                "FROM\n",
                "  `${var.catalog}`.`fsi_portfolio_assistant`.news n\n",
                "  JOIN `${var.catalog}`.`fsi_portfolio_assistant`.news_ticker nt ON n.article_id = nt.article_id\n",
                "  JOIN `${var.catalog}`.`fsi_portfolio_assistant`.portfolio p ON nt.ticker = p.ticker\n",
                "WHERE\n",
                "   n.sentiment < 0\n",
                "ORDER BY\n",
                "  n.published_time DESC\n",
                "LIMIT\n",
                "  10"
              ]
            }
          ],

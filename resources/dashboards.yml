    smart_claims_summary_dashboard:
      display_name: "[FSI Demo Pack] - Smart Claims Summary Report"
      warehouse_id: ${var.warehouse_id}
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "e2ef0fca",
              "displayName": "Claim - accident_image",
              "queryLines": [
                "select image_name, claim_no\n",
                "FROM `${var.catalog}`.`fsi_smart_claims`.accident_images"
              ]
            },
            {
              "name": "bde867be",
              "displayName": "Claim - Insight",
              "queryLines": [
                "select\n",
                "  CASE\n",
                "    WHEN valid_date = 'NOT VALID' THEN 1\n",
                "    ELSE 0\n",
                "  END as valid_policy,\n",
                "  CASE\n",
                "    WHEN reported_severity_check = 'Severity matches the report' THEN 1\n",
                "    ELSE 0\n",
                "  END as correct_severity_assessment,\n",
                "  CASE\n",
                "    WHEN valid_amount = 'claim value more than premium' THEN 1\n",
                "    ELSE 0\n",
                "  END as approve_claim_amount,\n",
                "  claim_amount_total,\n",
                "  claim_amount_injury,\n",
                "  claim_amount_property,\n",
                "  claim_amount_vehicle,\n",
                "  incident_severity as reported_severity,\n",
                "  -- severity as predicted_severity,\n",
                "  reported_severity_check,\n",
                "  valid_amount,\n",
                "  valid_date,\n",
                "  claim_no\n",
                "from\n",
                "  `${var.catalog}`.`fsi_smart_claims`.claim_insights\n",
                "\n",
                "  -- WHERE claim_no=:claim_no"
              ]
            },
            {
              "name": "91609f01",
              "displayName": "Claim - ClaimAmount",
              "queryLines": [
                "select\n",
                "  valid_amount,\n",
                "  count(*) as ctr\n",
                "FROM\n",
                "  `${var.catalog}`.`fsi_smart_claims`.claim_insights\n",
                "where\n",
                "  to_date(claim_date) >= :start_date\n",
                "  and to_date(claim_date) <= :end_date\n",
                "group by\n",
                "  valid_amount\n",
                "order by\n",
                "  valid_amount desc"
              ],
              "parameters": [
                {
                  "displayName": "start_date",
                  "keyword": "start_date",
                  "dataType": "DATE",
                  "defaultSelection": {
                    "values": {
                      "dataType": "DATE",
                      "values": [
                        {
                          "value": "2015-01-01"
                        }
                      ]
                    }
                  }
                },
                {
                  "displayName": "end_date",
                  "keyword": "end_date",
                  "dataType": "DATE",
                  "defaultSelection": {
                    "values": {
                      "dataType": "DATE",
                      "values": [
                        {
                          "value": "2021-05-01"
                        }
                      ]
                    }
                  }
                }
              ]
            },
            {
              "name": "d826e134",
              "displayName": "Claim -  claim_insights",
              "queryLines": [
                "select\n",
                "  claim_no,\n",
                "  claim_date,\n",
                "  policy_no,\n",
                "  CASE\n",
                "    WHEN valid_date = 'NOT VALID' THEN 0\n",
                "    ELSE 1\n",
                "  END as valid_policy,\n",
                "  CASE\n",
                "    WHEN reported_severity_check = 'Severity matches the report' THEN 0\n",
                "    ELSE 1\n",
                "  END as correct_severity_assessment,\n",
                "  CASE\n",
                "    WHEN valid_amount = 'claim value more than premium' THEN 0\n",
                "    ELSE 1\n",
                "  END as approve_claim_amount,\n",
                "  claim_amount_total,\n",
                "  claim_amount_injury,\n",
                "  claim_amount_property,\n",
                "  claim_amount_vehicle,\n",
                "  incident_severity as reported_severity,\n",
                "  -- severity as predicted_severity,\n",
                "  reported_severity_check,\n",
                "  valid_amount,\n",
                "  valid_date\n",
                "from\n",
                "  `${var.catalog}`.`fsi_smart_claims`.claim_insights;"
              ]
            },
            {
              "name": "e5c98314",
              "displayName": "Claim - getPolicy",
              "queryLines": [
                "select\n",
                "  * except (content)\n",
                "from\n",
                "  `${var.catalog}`.`fsi_smart_claims`.claim_insights\n",
                "\n",
                "--  where  POLICY_NO = \"{{policy_number}}\";\n",
                "\n",
                "\n"
              ]
            },
            {
              "name": "6ec9e508",
              "displayName": "Claim - getClaim",
              "queryLines": [
                "select\n",
                "  claim_no,\n",
                "  claim_amount_total,\n",
                "  claim_amount_injury,\n",
                "  claim_amount_property,\n",
                "  claim_amount_vehicle,\n",
                "  to_date(claim_date),\n",
                "  incident_type,\n",
                "  incident_severity,\n",
                "  incident_date,\n",
                "  collision_type,\n",
                "  collision_number_of_vehicles_involved,\n",
                "  driver_age,\n",
                "  driver_insured_relationship,\n",
                "  driver_license_issue_date,\n",
                "  months_as_customer,\n",
                "  number_of_witnesses,\n",
                "  suspicious_activity\n",
                "from\n",
                "  `${var.catalog}`.`fsi_smart_claims`.claim_insights\n",
                "\n",
                "--where  claim_no = '{{claim_number}}';"
              ]
            },
            {
              "name": "9ef54712",
              "displayName": "Claim -  telematic_insights",
              "queryLines": [
                "select\n",
                "  CHASSIS_NO,\n",
                "  claim_no,\n",
                "  avg(high_speed) as speeding,\n",
                "  CASE\n",
                "    WHEN avg(high_speed) < 0.25 THEN 0\n",
                "    ELSE 1\n",
                "  END as speeding_more_than_25percent\n",
                "from\n",
                "  (\n",
                "    select\n",
                "      chassis_no,\n",
                "      claim_no,\n",
                "      claim_date,\n",
                "      policy_no,\n",
                "      CASE\n",
                "        WHEN speed_check = 'High Speed' THEN 1\n",
                "        WHEN speed_check = 'Normal Speed' THEN 0\n",
                "        ELSE -1000\n",
                "      END as high_speed,\n",
                "      claim_amount_total,\n",
                "      incident_severity as reported_severity\n",
                "    from\n",
